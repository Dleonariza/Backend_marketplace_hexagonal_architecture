spring.application.name=Marketplace hexagonal architecture

# Database
# Usar variables de entorno en produccion: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
# ddl-auto=update crea/modifica tablas automaticamente al arrancar (solo desarrollo)
# En produccion usar: validate o none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT
# JWT_SECRET debe ser minimo 32 caracteres. Cambiar en produccion via variable de entorno
jwt.secret=${JWT_SECRET:marketplace-dev-secret-key}
# Duracion del access token: 15 minutos (900000 ms)
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
# Duracion del refresh token: 7 dias (604800000 ms)
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Mail (Gmail SMTP)
# Requiere App Password de Google (no la contrasena de la cuenta)
# Generarla en: myaccount.google.com/apppasswords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:info@mail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Default Admin
# Cambiar en produccion via variables de entorno
admin.default.email=${ADMIN_EMAIL:admin@marketplace.com}
admin.default.username=${ADMIN_USERNAME:admin}
admin.default.password=${ADMIN_PASSWORD:Admin1234!}
admin.default.name=${ADMIN_NAME:Administrator}
admin.default.phone=${ADMIN_PHONE:0000000000}

# Cart Expiration Job
# Cron expression for abandoned cart cleanup (default: daily at 2:00 AM)
# Format: second minute hour day month weekday
# Examples:
#   "0 0 2 * * *"      -> every day at 02:00 AM
#   "0 */30 * * * *"   -> every 30 minutes (useful for testing)
cart.expiration.cron=${CART_EXPIRATION_CRON:0 */30 * * * *}

# Actuator
# Endpoints expuestos publicamente. No exponer 'env' ni 'beans' en produccion
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Inquiry thread inactivity threshold (minutes) before the expiration job deletes it. 1440 = 1 day.
inquiry.inactivity-minutes=1440
